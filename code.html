<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <main class="login">
        <div class="login-container">
            <div class="login-t">
                <div class="login-t-title-container">
                    <span>زیبایی به سبک</span>
                    <img src="images/Logo.svg" alt="">
                </div>
                <div class="login-t-text">
                    <span>متنوع ترین کالکشن خانه و آشپزخانه و دکوراسیون</span>
                </div>
            </div>
            <div class="login-b">
                <div class="login-b-title-container">
                    <span>کد تایید</span>
                </div>
                <div class="login-b-input-container">
                    <form action="">
                        <label for="">کد تایید برای شماره 09109946021 پیامک شد.</label>
                        <div class="enter-code-sms">
                            <input type="text" maxlength="1">
                            <input type="text" maxlength="1">
                            <input type="text" maxlength="1">
                            <input type="text" maxlength="1">
                            <input type="text" maxlength="1">
                            <input type="text" maxlength="1">
                        </div>
                        <span id="login-alert"></span>
                        <a href="#" class="enter-pass">
                            ورود با رمز عبور
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"
                                fill="none">
                                <path d="M9.335 5.333 6.668 8l2.667 2.667" stroke="#0038bc" stroke-width="1.5"
                                    stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </a>
                        <div class="timer-code">
                            <p>
                                <span>2:00</span>
                                مانده تا دریافت مجدد کد
                            </p>
                        </div>
                        <button id="login-btn" type="submit">تایید</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script src="js/code.js"></script>
</body>

</html>
