<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <main class="login">
        <div class="login-container">
            <div class="login-t">
                <div class="login-t-title-container">
                    <span>زیبایی به سبک</span>
                    <img src="images/Logo.svg" alt="">
                </div>
                <div class="login-t-text">
                    <span>متنوع ترین کالکشن خانه و آشپزخانه و دکوراسیون</span>
                </div>
            </div>
            <div class="login-b">
                <div class="login-b-title-container">
                    <span>ورود | ثبت نام</span>
                </div>
                <div class="login-b-input-container">
                    <form action="">
                        <label for="">لطفا شماره موبایل خود را وارد کنید</label>
                        <input type="tel" name="" maxlength="11" id="login-input" placeholder="09120000000">
                        <span id="login-alert"></span>
                        <button id="login-btn" type="submit">تایید</button>
                        <p>با ورود به <a href="#">زی هوم</a> شما شرایط استفاده و <a href="#">قوانین حریم خصوصی </a>ما را
                            می
                            پذیرید
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script src="js/login.js"></script>
</body>

</html>
